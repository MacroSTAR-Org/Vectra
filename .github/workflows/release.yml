name: Release

on:
  # 打 tag 即发布：git tag 0.2.0.131 && git push --tags
  # 版本号沿用 pubspec 的 A.B.C+D → tag 写成 A.B.C.D
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version and tag
        id: get_tag
        shell: pwsh
        run: |
          # tag 触发：tag 名就是版本号，且 tag 已经存在，不再做"不存在"校验
          # 手动触发：从 pubspec 读版本，并要求对应 tag 还没打过
          $isTagPush = "${{ github.event_name }}" -eq "push"
          if ($isTagPush) {
            $version = "${{ github.ref_name }}"
            echo "tag_name=$version" >> $env:GITHUB_OUTPUT
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "Triggered by tag push: $version"
            exit 0
          }
          $match = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          if (-not $match) {
            throw "Could not read version from pubspec.yaml"
          }
          $pubspecVersion = $match.Line.Substring($match.Line.IndexOf(':') + 1).Trim()
          $version = $pubspecVersion -replace '\+', '.'
          echo "tag_name=$version" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Using pubspec version: $version"

      - name: Ensure tag does not exist
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.get_tag.outputs.tag_name }}"
          $existing = git tag --list "$tag"
          if ($existing) {
            throw "Tag '$tag' already exists"
          }

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: tool/cliff.toml
          args: --unreleased --tag ${{ steps.get_tag.outputs.tag_name }} --output CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: Glance-changelog-${{ github.sha }}
          path: CHANGELOG.md
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      portable_name: ${{ steps.find_portable.outputs.portable_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get


      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "choco is not available on this runner"
          }
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) {
            throw "choco install innosetup failed with exit code $LASTEXITCODE"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 was not installed"
          }

      - name: Build release and portable installer
        shell: cmd
        run: tool\build_release.bat

      - name: Create release folder archive
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path "installer/out" | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "installer/out/Glance-$version-release.zip" -Force
          Get-ChildItem "installer/out" | Select-Object Name,Length

      - name: Find portable installer
        id: find_portable
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $portable = Get-ChildItem "installer/out" -Filter "Glance-$version-*.exe" | Select-Object -First 1
          if (-not $portable) {
            throw "Portable installer not found"
          }
          echo "portable_name=$($portable.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Glance-${{ needs.prepare.outputs.version }}
          path: |
            installer/out/Glance-${{ needs.prepare.outputs.version }}-release.zip
            installer/out/${{ steps.find_portable.outputs.portable_name }}

  release:
    needs: [prepare, build]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: Glance-${{ needs.prepare.outputs.version }}
          path: release-artifacts

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: Glance-changelog-${{ github.sha }}
          path: changelog-artifacts

      - name: Prepare release body
        id: release_body
        shell: bash
        run: |
          version="${{ needs.prepare.outputs.version }}"
          portable="${{ needs.build.outputs.portable_name }}"
          zip_size=$(wc -c < "release-artifacts/Glance-$version-release.zip")
          portable_size=$(wc -c < "release-artifacts/$portable")
          cat changelog-artifacts/CHANGELOG.md > release-body.md
          {
            echo ""
            echo "## Files"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            echo "| Glance-$version-release.zip | $zip_size bytes |"
            echo "| $portable | $portable_size bytes |"
          } >> release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Glance ${{ needs.prepare.outputs.version }}
          body_path: release-body.md
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: false
          files: |
            release-artifacts/Glance-${{ needs.prepare.outputs.version }}-release.zip
            release-artifacts/${{ needs.build.outputs.portable_name }}
          fail_on_unmatched_files: false
