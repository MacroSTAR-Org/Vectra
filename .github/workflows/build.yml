name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  normal-build:
    name: 正常构建
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release --no-pub

      - name: Check build output
        shell: pwsh
        run: |
          $exePath = "build/windows/x64/runner/Release/glance.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "glance.exe not found: $exePath"
            exit 1
          }

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Glance-release-${{ github.sha }}
          path: build/windows/x64/runner/Release/*

  portable-build:
    name: 便携构建
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "choco is not available on this runner"
          }
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) {
            throw "choco install innosetup failed with exit code $LASTEXITCODE"
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 was not installed"
          }

      - name: Build Portable Installer
        shell: cmd
        run: tool\build_release.bat

      - name: Find Portable Installer
        id: find_portable
        shell: pwsh
        run: |
          $portable = Get-ChildItem "installer/out" -Filter "Glance-*.exe" | Select-Object -First 1
          if (-not $portable) {
            throw "Portable installer not found"
          }
          echo "portable_name=$($portable.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Glance-portable-${{ github.sha }}
          path: installer/out/${{ steps.find_portable.outputs.portable_name }}

  test:
    name: 测试
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

