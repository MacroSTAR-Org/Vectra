# The following section is specific to Flutter packages.
flutter:

  assets:
    - assets/tray.ico
    - assets/logo.png
    - assets/plugins/clock/
    - assets/plugins/calendar/
    - assets/plugins/todo/
    - assets/plugins/weather/
    - assets/plugins/lyrics/

  # 鍏ㄥ眬瀛椾綋锛氶缚钂?HarmonyOS Sans SC
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: lib/fonts/HarmonyOS_Sans_SC_Thin.ttf
          weight: 100
        - asset: lib/fonts/HarmonyOS_Sans_SC_Light.ttf
          weight: 300
        - asset: lib/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: lib/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: lib/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
        - asset: lib/fonts/HarmonyOS_Sans_SC_Black.ttf
          weight: 900

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

